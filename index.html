<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4D Plotter — R⁴ 中的拓扑空间</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e14;
        --panel: #131822;
        --border: #232b3a;
        --text: #cdd6e4;
        --muted: #8b96a8;
        --accent: #5eb3f6;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.6 'Segoe UI', system-ui, sans-serif;
      }
      body { display: flex; }
      #app { flex: 1; min-width: 0; height: 100%; }
      #app canvas { display: block; }
      #panel {
        width: 300px;
        flex-shrink: 0;
        height: 100%;
        overflow-y: auto;
        background: var(--panel);
        border-left: 1px solid var(--border);
        padding: 14px 16px;
      }
      #panel::before {
        content: '4D Plotter';
        display: block;
        font-size: 16px;
        font-weight: 600;
        color: var(--accent);
        margin-bottom: 10px;
      }
      .control-row {
        display: block;
        margin: 10px 0;
      }
      .control-row > span {
        display: block;
        color: var(--muted);
        margin-bottom: 3px;
      }
      .desc {
        color: var(--muted);
        font-size: 12px;
        margin: 6px 0 12px;
        border-left: 2px solid var(--border);
        padding-left: 8px;
      }
      .section-title {
        margin: 16px 0 6px;
        color: var(--muted);
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.08em;
      }
      .plane-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0;
      }
      .plane-tag {
        width: 24px;
        font-family: Consolas, monospace;
        color: var(--accent);
      }
      .plane-row input[type='range'] { flex: 1; }
      .inline { display: flex; align-items: center; gap: 8px; }
      select, button {
        width: 100%;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 5px 8px;
      }
      button { cursor: pointer; margin-top: 12px; }
      button:hover { border-color: var(--accent); }
      input[type='range'] { width: 100%; accent-color: var(--accent); }
      input[type='checkbox'] { accent-color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
